aid: qed-investors
name: QED Investors
description: >-
  QED Investors is a global venture capital firm founded in 2007 by Nigel Morris and Frank Rotman,
  both early leaders at Capital One, and headquartered in Alexandria, Virginia. QED invests
  exclusively in fintech and financial-services technology, backing what it calls "pragmatic
  disruptors who are the future of finance" across credit and lending, banking and neobanks,
  banking-as-a-service and embedded finance, payments, insurance/insurtech, wealth management,
  proptech, and real-estate technology. The firm invests from pre-seed and seed through Series A and
  growth stages, with early-stage initial checks generally in the $3M-$10M range (roughly $15M
  average once follow-on is included) and $15M-$20M average from its growth fund. QED operates
  globally with investment teams across the United States, Latin America, Europe, Asia/India, and
  Africa, and offices in Alexandria (VA), London, Singapore, Mexico, and Brazil. It reports roughly
  $4B in assets under management, more than 250 portfolio companies, and over 30 unicorns, with
  notable investments including Nubank, Credit Karma, SoFi, Klarna, Remitly, Flywire, Klarna,
  Kavak, Creditas, and Bitso.
